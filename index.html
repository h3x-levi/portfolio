    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Initialize theme state before React renders to prevent layout flashes
    (function () {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            stone: {
              50: '#FAFAF9',
              100: '#F5F5F4',
              200: '#E7E5E4',
              300: '#D6D3D1',
              400: '#A8A29E',
              500: '#78716C',
              600: '#57534E',
              700: '#44403C',
              800: '#292524',
              900: '#1C1917',
            },
            accent: {
              DEFAULT: '#EA580C',
              light: '#FFF7ED',
              50: '#FFF7ED',
              100: '#FFEDD5',
              200: '#FED7AA',
              500: '#F97316',
              600: '#EA580C',
              700: '#C2410C',
            }
          }
        }
      }
    }
  </script>

}
</script>
